name: Docker Image Build and Push

on:
  workflow_call:

permissions:
  contents: write

jobs:
  image_push:
    runs-on: self-hosted

    env:
      DOCKER_IMAGE: kashimo0054/petapp:${{ github.sha }}

    steps:
      # -----------------------------------------------------------
      # 1. Checkout source repository
      # -----------------------------------------------------------
      - name: Checkout build repo
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2. Download the built JAR artifact
      # -----------------------------------------------------------
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic-jar
          path: target

      - name: Verify artifact
        run: ls -lh target

      # -----------------------------------------------------------
      # 3. Build and push Docker image
      # -----------------------------------------------------------
      - name: Build Docker Image
        run: |
          sudo docker build -t ${{ env.DOCKER_IMAGE }} .
          sudo docker save ${{ env.DOCKER_IMAGE }} > docker_image.tar

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: sudo docker push ${{ env.DOCKER_IMAGE }}

      # -----------------------------------------------------------
      # 4. REMOVE OLD CACHED GITOPS FOLDER
      # -----------------------------------------------------------
      - name: Remove old GitOps repo (self-hosted runner fix)
        run: |
          rm -rf gitops
          rm -rf petclinic-k8s-gitops
          echo "Old cached GitOps folders removed."

      # -----------------------------------------------------------
      # 5. MANUAL CLONE WITH PAT (checkout alternative)
      # -----------------------------------------------------------
      - name: Clone GitOps Repo manually
        env:
          PAT: ${{ secrets.SECRET_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/Kashimo0054/petclinic-k8s-gitops.git gitops

      - name: DEBUG REMOTE
        working-directory: gitops
        run: git remote -v

      # -----------------------------------------------------------
      # 6. Update deployment YAML with new Docker image
      # -----------------------------------------------------------
      - name: Update image in GitOps manifest
        working-directory: gitops
        run: |
          set -e
          FILE="petclinic-deployment.yaml"

          echo "Before update:"
          grep -E '^\s*image:' "$FILE" || true

          sed -i -E "s|(^\s*image:\s*).*|\1${{ env.DOCKER_IMAGE }}|" "$FILE"

          echo "After update:"
          grep -E '^\s*image:' "$FILE" || true

      # -----------------------------------------------------------
      # 7. Commit and push back to GitOps repo
      # -----------------------------------------------------------
      - name: Commit and push changes to GitOps
        working-directory: gitops
        env:
          PAT: ${{ secrets.SECRET_PAT }}
          GIT_AUTHOR_NAME: "Kashimo0054"
          GIT_AUTHOR_EMAIL: "sumeettanpure2729@gmail.com"

        run: |
          set -e
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git add petclinic-deployment.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update image to ${{ env.DOCKER_IMAGE }}"

          git push https://x-access-token:${PAT}@github.com/Kashimo0054/petclinic-k8s-gitops.git HEAD:main
