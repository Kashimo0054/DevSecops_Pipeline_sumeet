name: Snyk Security - Dependency Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  snyk-maven:
    name: Snyk - Maven Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project with Maven
        run: mvn package -DskipTests

      - name: Fix JAVA_HOME for Snyk
        run: |
          JAVA_BIN=$(which java)
          JAVA_REAL=$(readlink -f $JAVA_BIN)
          echo "JAVA_HOME=$(dirname $(dirname $JAVA_REAL))" >> $GITHUB_ENV

      - name: Snyk scan - Maven dependencies
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        with:
          args: --severity-threshold=high
