name: Snyk Security - Dependency Check

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  snyk-maven:
    name: Snyk - Maven Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project with Maven
        run: mvn package -DskipTests

      # Install Snyk CLI directly — avoids the Docker container JAVA_HOME issue entirely
      - name: Install Snyk CLI
        run: npm install -g snyk

      # Authenticate using the token
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      # Run the scan directly on the host where Java is available
      - name: Snyk scan - Maven dependencies
        run: snyk test --all-projects --severity-threshold=high
        continue-on-error: true   # warn only — never fail the build
